version: '3.8'

services:
  portfolio-prism:
    image: ghcr.io/skeptomenos/portfolio-prism:latest
    # Or build locally:
    # build: .
    ports:
      - "8501:8501"
    volumes:
      # Persist user data across container updates
      - ./data:/app/data
      - ./config:/app/config
    environment:
      - DOCKER_MODE=true
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
      - GITHUB_ISSUES_TOKEN=${GITHUB_ISSUES_TOKEN}
    env_file:
      - .env  # Optional: load from .env file
    restart: unless-stopped
