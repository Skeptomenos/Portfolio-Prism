[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio_poc"
version = "0.1.0"
description = "Portfolio True Exposure POC"
authors = [{name = "David Helmus", email = "david@example.com"}]
requires-python = ">=3.9"
dependencies = [
    "pandas",
    "playwright",
    "yfinance",
    "python-dotenv",
    "requests",
    "beautifulsoup4",
    "lxml",
    "pdfplumber",
    "deep-translator",
    "tqdm",
    "python-calamine",
    "openpyxl",
    "pytest",
    "pandera",
    "cryptography",  # Required by pdfplumber
    "pydantic",      # Data validation models
    "streamlit",     # Dashboard UI
    "plotly",        # Interactive charts
    "matplotlib",    # Static charts (visualize_portfolio.py)
    "pytr",          # Trade Republic API
]

[project.scripts]
install-browsers = "playwright._impl._driver:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
