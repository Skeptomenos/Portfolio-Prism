[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio_poc"
version = "0.1.0"
description = "Portfolio True Exposure POC"
authors = [{name = "David Helmus", email = "david@example.com"}]
requires-python = ">=3.9"
dependencies = [
    # Core
    "pandas>=2.0.0",
    "pydantic>=2.0",
    
    # Data acquisition
    "pytr>=0.4.2",           # Trade Republic API
    "selenium",
    "selenium-wire",
    "webdriver-manager",
    "requests",
    "beautifulsoup4",
    "lxml",
    
    # Data processing
    "yfinance",
    "pdfplumber",
    "python-calamine",
    "openpyxl",
    "deep-translator",
    "pandera",
    "cryptography",
    
    # Dashboard
    "streamlit>=1.30",
    "plotly>=5.18",
    
    # Utils
    "python-dotenv",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
